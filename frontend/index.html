<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0E" />
    <meta name="description" content="Point your camera at a Kannada sign and read it in English. Built for Modalapada 2.0." />
    <title>Lipi Lens · ಲಿಪಿ ಲೆನ್ಸ್</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23141414'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='%23F2C14E'>ಲಿ</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400..800&family=Noto+Sans+Kannada:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('lipi-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
